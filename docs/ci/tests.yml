name: Testler

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # StreamGuard, Xtream istemcisi, önbellek ve EPG testleri Qt/mpv gerektirmez
      - run: python -m pip install requests pytest
      - run: python -m pytest -v
